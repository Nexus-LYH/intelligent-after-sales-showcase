# Keep production application.yml visible; a test application.yml shadows it
# wholesale on the classpath and loses required origin/security configuration.
# Portable H2 contexts cannot execute the production MySQL session statement.
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=4
spring.test.database.replace=none

